org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# Off on purpose. The refmap is written by the mixin annotation processor as a side file that the build
# cache does not capture, so a cache hit restores the compiled classes and silently leaves it out. The
# 1.20.4 jar once shipped to a test server that way, and every SRG mixin failed to find its target.
org.gradle.caching=false

mod_id=farlandsreforged
mod_name=Farlands Reforged
mod_license=MIT
mod_group_id=com.shigeo.farlandsreforged
mod_authors=Shigeo
mod_description=Restores classic Far Lands-style terrain generation in modern Minecraft by preserving full Perlin noise coordinate precision. Inspired by AdyTech99's Farlands Reborn.

minecraft_version=1.20.4
minecraft_version_range=[1.20.4]
forge_version=49.2.0
forge_loader_major=49
# Every Forge 1.20.x build ships Mixin 0.8.5, so there is no newer floor to pick.
forge_version_min=49
mod_version=0.4.0+mc1.20.4-forge
java_version=17
