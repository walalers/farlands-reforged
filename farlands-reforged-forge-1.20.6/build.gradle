plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

minecraft {
    // Forge 51 runs on Mojang's official names - verified by javap on an installed
    // forge-1.21-51.0.33 server, whose DensityFunctions$Noise has `noise`/`compute`, not SRG ids. So the
    // sources are written against official names and the jar ships them unchanged: no reobf, no refmap,
    // and remap = false on every @Mixin, exactly like farlands-reforged-forge-1.21.11 and the 26.x project.
    mappings channel: 'official', version: minecraft_version

    // ForgeGradle 6 run configurations, which spell these differently from the FG7 ones in
    // farlands-reforged-forge-26.2.
    runs {
        client {
            workingDirectory project.file('run')
            args "--mixin.config=${mod_id}.mixins.json"
        }
        server {
            workingDirectory project.file('run')
            args '--nogui', "--mixin.config=${mod_id}.mixins.json"
        }
    }
}

repositories {
    // Mojang's library repo has to come first. Minecraft 1.21 needs LWJGL's natives-macos-patch
    // artifacts, which exist only here - but the plain lwjgl POMs are on Maven Central too, and Gradle
    // fetches every artifact of a module from whichever repository supplied its metadata. Let Central
    // win the metadata and the patch jars become unresolvable.
    maven { name = 'Mojang'; url = 'https://libraries.minecraft.net/' }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_loader_major     : forge_loader_major,
        forge_version_min      : forge_version_min,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}
