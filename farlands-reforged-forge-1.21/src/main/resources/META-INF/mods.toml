modLoader="javafml"
loaderVersion="[${forge_loader_major},)"
license="${mod_license}"
issueTrackerURL="https://github.com/walalers/farlands-reforged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/walalers/farlands-reforged"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.farlandsreforged]]
    modId="forge"
    mandatory=true
    # Not simply "[major,)": Forge 1.21 builds before 51.0.23 bundle Mixin 0.8.5, which does not
    # recognise this mod's JAVA_21 compatibility level and kills the server during bootstrap.
    versionRange="[${forge_version_min},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.farlandsreforged]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
